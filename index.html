<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 700px;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #a78bfa, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }

        .cta-button {
            display: inline-block;
            padding: 0.9rem 2.5rem;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(96, 165, 250, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(96, 165, 250, 0.5);
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            pointer-events: none;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #a78bfa;
            top: -100px;
            right: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #60a5fa;
            bottom: -80px;
            left: -80px;
        }

        footer {
            position: fixed;
            bottom: 2rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="container">
        <span class="badge">🚀 Demo Environment</span>
        <h1>Demo Website</h1>
        <p>
            This site is used exclusively for <strong>demonstration purposes</strong>.
            All content, data, and functionality presented here are fictional and intended
            for testing and showcasing only.
        </p>
        <a href="#" class="cta-button">Explore Demo</a>
    </div>

    <footer>&copy; 2026 Demo Site &mdash; Not for production use</footer>
</body>
</html>
